name: SEED quality gates
on:
  pull_request:
  push:
    branches: [release/free-first-value]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:verify
      # No automatic deployment. Staging evidence, restore drill, legal review,
      # backup confirmation and explicit approval remain separate release gates.
