name: SeedAI operational health
# Manual until the reviewed production release, dedicated read-only token,
# exact firewall exception and alert ownership/notification test are complete.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seedai-operational-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
      - run: node scripts/run-health-check.mjs
        env:
          SEED_HEALTH_URL: https://appseedai.com/api/internal/health
          SEED_HEALTH_TOKEN: ${{ secrets.SEED_HEALTH_TOKEN }}
